name: Python Dependency Audit

on:
  pull_request:
    paths:
      - "requirements.txt"
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pip-audit:
    name: Audit requirements
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install pip-audit
        run: python -m pip install --upgrade pip-audit

      - name: Audit pinned dependencies
        run: python -m pip_audit -r requirements.txt
